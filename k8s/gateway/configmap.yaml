apiVersion: v1
kind: ConfigMap
metadata:
  name: universal-ai-gateway-config
  namespace: ftgo
data:
  LOG_LEVEL: "info"
  DOWNSTREAM_URL: "http://ftgo-api-gateway:8080"
  DOWNSTREAM_HEALTH_URL: "http://ftgo-api-gateway:8080/health"
  CACHE_BYPASS_PATHS: "/health,/admin,/actuator/health"
  DB_HOST: "ftgo-postgres-postgresql"
  DATABASE__HOST: "ftgo-postgres-postgresql"
  DB_PORT: "5432"
  DATABASE__PORT: "5432"
  DB_NAME: "postgres"
  DATABASE__NAME: "postgres"
  DB_USER: "postgres"
  DATABASE__USER: "postgres"
  DB_POOL_SIZE: "5"
  DATABASE__POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DATABASE__MAX_OVERFLOW: "5"
  REDIS_HOST: "ftgo-redis-master"
  REDIS__HOST: "ftgo-redis-master"
  REDIS_PORT: "6379"
  REDIS__PORT: "6379"
