apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-ai-gateway
  namespace: ftgo
  labels:
    app: universal-ai-gateway
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-ai-gateway
  template:
    metadata:
      labels:
        app: universal-ai-gateway
    spec:
      containers:
        - name: universal-ai-gateway
          image: 120569617989.dkr.ecr.ap-south-1.amazonaws.com/universal-ai-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: universal-ai-gateway-config
            - secretRef:
                name: universal-ai-gateway-secret
