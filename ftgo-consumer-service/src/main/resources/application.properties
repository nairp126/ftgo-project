spring.application.name=consumer-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/consumer_db
spring.datasource.username=anshumanrangarh
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=consumer-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topics
ftgo.kafka.topics.order-created=order.created
ftgo.kafka.topics.payment-authorized=payment.authorized
ftgo.kafka.topics.payment-failed=payment.failed
ftgo.kafka.topics.ticket-created=ticket.created
ftgo.kafka.topics.ticket-rejected=ticket.rejected