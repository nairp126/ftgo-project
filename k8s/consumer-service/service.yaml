apiVersion: v1
kind: Service
metadata:
  name: ftgo-consumer-service
  namespace: ftgo
  labels:
    app: consumer-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: consumer-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consumer-service-config
  namespace: ftgo
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://ftgo-postgres-postgresql:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: consumer-service-secret
  namespace: ftgo
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: bXlzZWNyZXRwYXNzd29yZA==
