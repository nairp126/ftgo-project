apiVersion: apps/v1
kind: Deployment

metadata:
  name: ftgo-order-service
  namespace: ftgo
  labels:
    app: ftgo-order-service
    component: order
    managed-by: kubectl
    version: "0.1.0"
  annotations:
    deployment.kubernetes.io/reason: "Initial deployment of Order Service"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ftgo-order-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: ftgo-order-service
        component: order
        version: "0.1.0"

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: ftgo-order-service

          image: 120569617989.dkr.ecr.ap-south-1.amazonaws.com/ftgo-order-service:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: ftgo-order-service-config

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
