name: Kitchen Service CI/CD

on:
  push:
    branches:
      - main
      - dev
      - Kitchen-Restaurant-Service
      - 'feature/**'
      - 'fix/**'
    paths:
      - "kitchen-service/**"
      - "k8s/kitchen-service/**"
      - ".github/workflows/kitchen-service-ci-cd.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "kitchen-service/**"
      - "k8s/kitchen-service/**"
      - ".github/workflows/kitchen-service-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.KITCHEN_ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  SERVICE_DIRECTORY: kitchen-service
  K8S_DIRECTORY: k8s/kitchen-service
  DEPLOYMENT_NAME: kitchen-service
  CONTAINER_NAME: kitchen-service

jobs:
  test:
    name: Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: ${{ env.SERVICE_DIRECTORY }}
        run: mvn --batch-mode test

      - name: Build Maven package
        working-directory: ${{ env.SERVICE_DIRECTORY }}
        run: mvn --batch-mode package -DskipTests

  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION || secrets.AWS_REGION || vars.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            "$SERVICE_DIRECTORY"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Configure kubectl for Amazon EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f "$K8S_DIRECTORY"

      - name: Deploy image to Amazon EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" --timeout=180s
