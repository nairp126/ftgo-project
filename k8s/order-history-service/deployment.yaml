apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftgo-order-history-service
  namespace: default
  labels:
    app: order-history-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-history-service
  template:
    metadata:
      labels:
        app: order-history-service
        component: backend
    spec:
      containers:
        - name: order-history-service
          image: ftgo-order-history-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: order-history-service-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
