name: Order Service CI/CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "ftgo-order-service/**"
      - "k8s/order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "ftgo-order-service/**"
      - "k8s/order-service/**"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ORDER_ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  SERVICE_DIRECTORY: ftgo-order-service
  K8S_DIRECTORY: k8s/order-service
  DEPLOYMENT_NAME: ftgo-order-service

jobs:
  test:
    name: Test and Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftgo-order-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test
      - name: Build application
        run: ./gradlew bootJar

  build-and-deploy:
    name: Build, Push ECR Image, and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$SERVICE_DIRECTORY"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
