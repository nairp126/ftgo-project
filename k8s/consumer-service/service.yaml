apiVersion: v1
kind: Service
metadata:
  name: ftgo-consumer-service
  labels:
    app: consumer-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: consumer-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consumer-service-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-consumer:5432/ftgo-consumer"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
---
apiVersion: v1
kind: Secret
metadata:
  name: consumer-service-secret
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: Y29uc3VtZXJfcGFzc3dvcmQ=
