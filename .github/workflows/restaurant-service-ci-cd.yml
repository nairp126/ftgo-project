name: Restaurant Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "restaurant-service/**"
      - "k8s/restaurant-service/**"
      - ".github/workflows/restaurant-service-ci-cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "restaurant-service/**"
      - "k8s/restaurant-service/**"
      - ".github/workflows/restaurant-service-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.RESTAURANT_ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  SERVICE_DIRECTORY: restaurant-service
  K8S_DIRECTORY: k8s/restaurant-service
  DEPLOYMENT_NAME: restaurant-service
  CONTAINER_NAME: restaurant-service

jobs:
  test:
    name: Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: ${{ env.SERVICE_DIRECTORY }}
        run: mvn --batch-mode test

      - name: Build Maven package
        working-directory: ${{ env.SERVICE_DIRECTORY }}
        run: mvn --batch-mode package -DskipTests

  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            "$SERVICE_DIRECTORY"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Configure kubectl for Amazon EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f "$K8S_DIRECTORY"

      - name: Deploy image to Amazon EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" --timeout=180s
