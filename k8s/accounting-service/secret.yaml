apiVersion: v1
kind: Secret
metadata:
  name: ftgo-accounting-service-secret
  namespace: ftgo
  labels:
    app: ftgo-accounting-service
    component: accounting
    managed-by: kubectl
type: Opaque
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Do NOT commit real credentials here.
# In production, populate this Secret via:
#   - External Secrets Operator (ESO) syncing from AWS Secrets Manager / GCP Secret Manager
#   - Sealed Secrets (Bitnami) for GitOps-friendly encrypted storage
#   - Vault Agent Injector (HashiCorp Vault)
#
# Placeholder values below are base64-encoded strings of the literal text
# "REPLACE_ME" — they are intentionally non-functional.
# ─────────────────────────────────────────────────────────────────────────────
data:
  # echo -n "REPLACE_ME" | base64  → UkVQTEFDRV9NRQ==
  DB_USERNAME: UkVQTEFDRV9NRQ==
  DB_PASSWORD: UkVQTEFDRV9NRQ==
