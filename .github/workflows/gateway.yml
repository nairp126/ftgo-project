name: Gateway CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - 'Universal-AI-Gateway/**'
      - 'k8s/gateway/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'Universal-AI-Gateway/**'
      - 'k8s/gateway/**'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Universal-AI-Gateway/requirements-dev.txt pytest-mock

      - name: Run Tests
        run: |
          cd Universal-AI-Gateway
          pytest tests/ -v --cov=app

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
          docker build -t $ECR_REGISTRY/universal-ai-gateway:$IMAGE_TAG ./Universal-AI-Gateway
          docker push $ECR_REGISTRY/universal-ai-gateway:$IMAGE_TAG

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Apply Base Configs
        run: |
          kubectl apply -f k8s/gateway/configmap.yaml -n ftgo
          kubectl apply -f k8s/gateway/service.yaml -n ftgo
          kubectl apply -f k8s/gateway/ingress.yaml -n ftgo

      - name: Deploy Gateway with Substituted Image
        run: |
          sed -i "s|\${ECR_REGISTRY}|${{ secrets.ECR_REGISTRY }}|g" k8s/gateway/deployment.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" k8s/gateway/deployment.yaml
          kubectl apply -f k8s/gateway/deployment.yaml -n ftgo

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/universal-ai-gateway -n ftgo --timeout=300s

      - name: Rollback on Failure
        if: failure()
        run: |
          kubectl rollout undo deployment/universal-ai-gateway -n ftgo

# Required GitHub Secrets:
# - AWS_ACCOUNT_ID
# - AWS_REGION
# - EKS_CLUSTER_NAME
# - ECR_REGISTRY
# - DATABASE_URL
# - REDIS_URL
# - JWT_SECRET_KEY
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - S3_BUCKET_NAME
