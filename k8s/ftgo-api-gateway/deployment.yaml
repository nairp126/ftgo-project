apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftgo-api-gateway
  namespace: ftgo
  labels:
    app: ftgo-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ftgo-api-gateway
  template:
    metadata:
      labels:
        app: ftgo-api-gateway
    spec:
      containers:
        - name: ftgo-api-gateway
          image: 120569617989.dkr.ecr.ap-south-1.amazonaws.com/ftgo-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ftgo-api-gateway-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
