# Default values for universal-ai-gateway.
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: nairp126/universal-ai-gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ai-gateway.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application Configuration
config:
  logLevel: INFO
  enableCache: true
  mockLlm: false
  dbHost: "postgres"
  dbPort: 5432
  dbName: "llm_gateway"
  dbUser: "postgres"
  redisHost: "redis"
  redisPort: 6379

envFromSecrets:
  - name: gateway-secrets
    # keys: OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY, WEBHOOK_URL, ADMIN_API_KEY, DB_PASSWORD
