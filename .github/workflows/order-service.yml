name: Order Service CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "ftgo-order-service/**"
      - "k8s/order-service/**"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - "ftgo-order-service/**"
      - "k8s/order-service/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ftgo-order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  build:
    needs: test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ftgo-order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew bootJar

      - name: Build Docker image
        run: docker build -t ftgo-order-service .
