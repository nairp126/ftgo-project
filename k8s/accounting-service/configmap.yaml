apiVersion: v1
kind: ConfigMap
metadata:
  name: ftgo-accounting-service-config
  namespace: ftgo
  labels:
    app: ftgo-accounting-service
    component: accounting
    managed-by: kubectl
    version: "0.1.0"
data:
  # Server
  SERVER_PORT: "8080"

  # Database (non-secret config — credentials come from Secret)
  DB_URL: "jdbc:postgresql://ftgo-accounting-postgres:5432/ftgo_accounting"
  DDL_AUTO: "validate"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  KAFKA_MAX_RETRIES: "3"
  KAFKA_RETRY_INTERVAL_MS: "1000"

  # Topic names (match Order Service's published topic names exactly)
  TOPIC_ORDER_CREATED: "order.created"
  TOPIC_PAYMENT_AUTHORIZED: "payment.authorized"
  TOPIC_PAYMENT_FAILED: "payment.failed"

  # JVM
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
