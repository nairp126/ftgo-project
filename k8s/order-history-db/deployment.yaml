apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-history-db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-history-db

  template:
    metadata:
      labels:
        app: order-history-db

    spec:
      containers:
        - name: postgres
          image: postgres:13

          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: order-history-db-secret

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: order-history-db-pvc